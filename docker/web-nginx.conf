# Nex web：静态资源 + /api、/ws 反代到 server 容器。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # WebSocket RPC 通道
    location /ws {
        proxy_pass http://server:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # agent 长任务可能长时间无帧，放宽读写超时
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    location /api/ {
        proxy_pass http://server:3030;
        proxy_set_header Host $host;
        proxy_read_timeout 2h;
    }

    # SPA fallback：本地命不中的路径全部转交 server（含 `/`）。
    # server 开了 NEX_WEB_STATIC_ROOT 后能自己回 index.html，且 `/` 由 server
    # 处理是 token bootstrap 的关键——`/?token=` 靠它种下 nex_lite_token
    # cookie，浏览器后续的 /api、/ws 请求才能通过鉴权。
    location / {
        try_files $uri $uri/ @server;
    }

    location @server {
        proxy_pass http://server:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }
}
