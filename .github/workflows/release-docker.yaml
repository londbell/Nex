# Docker 镜像发布（GitHub 侧）：tag / 手动触发时构建 server 与 web 镜像并推 GHCR。
# Gitea 侧由 .gitea/workflows/release-docker.yaml 推到 gitea.tylinux.cn，两边镜像同源。
#
# 产物（以 tag v1.0.0 为例）：
#   ghcr.io/tylinux/nex-server:1.0.0 / :latest
#   ghcr.io/tylinux/nex-web:1.0.0    / :latest
name: Release Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: tylinux

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          # v1.0.0 -> 1.0.0；手动触发回退到分支短 sha。
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then
            version="$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "$OWNER" --password-stdin

      - name: Build server image
        run: |
          docker build \
            --target server \
            -t "$REGISTRY/$OWNER/nex-server:${{ steps.meta.outputs.version }}" \
            -t "$REGISTRY/$OWNER/nex-server:latest" \
            .

      - name: Build web image
        run: |
          docker build \
            --target web \
            -t "$REGISTRY/$OWNER/nex-web:${{ steps.meta.outputs.version }}" \
            -t "$REGISTRY/$OWNER/nex-web:latest" \
            .

      - name: Push images
        run: |
          docker push "$REGISTRY/$OWNER/nex-server:${{ steps.meta.outputs.version }}"
          docker push "$REGISTRY/$OWNER/nex-server:latest"
          docker push "$REGISTRY/$OWNER/nex-web:${{ steps.meta.outputs.version }}"
          docker push "$REGISTRY/$OWNER/nex-web:latest"
