# ghcr.io 镜像发布：构建 server / web 两个镜像并推到 GitHub Container Registry。
#
# 触发与 tag 规则：
#   - main 分支更新 / 手动 dispatch → 预览 tag：edge、main-<shortsha>（不动 latest）
#   - v* tag 推送 → 正式 tag：<version>（去 v 前缀）+ latest
#
# 产物（tag v1.0.2 为例）：
#   ghcr.io/tylinux/nex-server:1.0.2 / :latest
#   ghcr.io/tylinux/nex-web:1.0.2    / :latest
# 已带 buildx + GHA 层缓存，重复构建很快。
#
# 首次发布后建议把两个 package 的可见性改为 public（GitHub → Packages →
# Package settings → Danger Zone），部署机即可免登录拉取。
name: Docker images (ghcr)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: tylinux

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        env:
          IMAGE_SERVER: ${{ env.REGISTRY }}/${{ env.OWNER }}/nex-server
          IMAGE_WEB: ${{ env.REGISTRY }}/${{ env.OWNER }}/nex-web
        run: |
          set -euo pipefail
          write_tags() {
            local output_name="$1" image="$2"
            {
              echo "${output_name}<<EOF"
              if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
                echo "${image}:${GITHUB_REF_NAME#v}"
                echo "${image}:latest"
              else
                echo "${image}:edge"
                echo "${image}:main-$(git rev-parse --short HEAD)"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }
          write_tags server-tags "$IMAGE_SERVER"
          write_tags web-tags "$IMAGE_WEB"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: ${{ steps.meta.outputs.server-tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta.outputs.web-tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
