# ghcr.io 镜像发布：构建 server / web 两个镜像并推到 GitHub Container Registry。
# 触发：v* tag 推送或手动 dispatch（手动时以当前默认分支构建，镜像号取短 sha）。
#
# 产物（tag v1.0.2 为例）：
#   ghcr.io/tylinux/nex-server:1.0.2 / :latest
#   ghcr.io/tylinux/nex-web:1.0.2    / :latest
#
# 首次发布后建议把两个 package 的可见性改为 public（GitHub → Packages →
# Package settings → Danger Zone），部署机即可免登录拉取。
name: Docker images (ghcr)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: tylinux

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nex-server:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nex-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nex-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nex-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
