# Nex server 单二进制发布：构建三个平台的 SEA 二进制一键安装包并上传 GitHub Release。
#
# 触发与发布规则（与 docker 的 edge/latest 对齐）：
#   - main 分支更新 / 手动 dispatch → 固定 tag `alpha`（每次覆盖资产，tag 跟随 main HEAD）
#   - v* tag 推送 → 正式版本化资产，上传到该 tag 的 Release
#
# 产物（一键安装包：二进制 + packaging/ 的 install.sh、systemd unit、launchd plist）：
#   nex-server-darwin-arm64.tar.gz
#   nex-server-linux-x64.tar.gz
#   nex-server-linux-arm64.tar.gz
#
# 本机 Node 版本必须与 third-party/runtime/sources.json 登记的 license 条目一致
# （当前锚定 24.14.0），CI 用 setup-node 固定。
name: Server binaries (SEA)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-latest, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build workspace packages and agent bundle
        run: |
          pnpm typecheck
          pnpm -r --filter "@nex/cli..." build

      - name: Build SEA binary (${{ matrix.target }})
        working-directory: packages/server
        run: node scripts/build-sea.mjs --target ${{ matrix.target }}

      - name: Package one-step install tarball
        working-directory: packages/server/dist/sea
        run: |
          mkdir -p bundle/packaging
          cp nex-server-${{ matrix.target }} bundle/
          cp -r ../../../packaging/. bundle/packaging/
          tar -czf nex-server-${{ matrix.target }}.tar.gz -C bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nex-server-${{ matrix.target }}
          path: packages/server/dist/sea/nex-server-${{ matrix.target }}.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish versioned release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nex-server-*.tar.gz

      # main 更新 → alpha-<shortsha> 标签的滚动发布：每次 main 构建一个独立
      # 的 alpha release（tag 指向当次 commit，历史 alpha 保留可回溯）。
      - name: Publish alpha release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shortsha="$(git rev-parse --short "$GITHUB_SHA")"
          tag="alpha-${shortsha}"
          notes="Alpha build of the server SEA binaries at commit ${GITHUB_SHA}.

One-step install: extract the tarball for your platform and run
\`sudo ./packaging/install.sh --binary ./nex-server-<target>\`."
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nex server (${tag})" \
            --notes "$notes" \
            dist/nex-server-*.tar.gz
