# Docker 镜像发布流水线：tag 推送 / Release 发布 / 手动触发时，
# 构建 server 与 web 两个镜像并推送到 Gitea 内置 Container Registry
# （Packages → Container，registry host 即 gitea.tylinux.cn）。
#
# 推送认证用 Actions 自动注入的 token；若 runner 的 Gitea 版本对该 token
# 未开放 package 写权限，配置 secret DOCKER_TOKEN（Gitea 个人 Access Token，
# 勾 package:write）作为回退。
#
# 产物（以 tag v1.0.0 为例）：
#   gitea.tylinux.cn/tylinux/nex-server:1.0.0 / :latest
#   gitea.tylinux.cn/tylinux/nex-web:1.0.0    / :latest
#
# 拉取：docker pull gitea.tylinux.cn/tylinux/nex-server:latest（需先 docker login）。
name: Release Docker images

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: gitea.tylinux.cn
  OWNER: tylinux

jobs:
  build-and-push:
    runs-on: linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          # v1.0.0 -> 1.0.0；非 tag 触发（手动/release 事件）回退到分支短 sha。
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then
            version="$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Login to Gitea container registry
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.GITEA_TOKEN || github.token }}
        run: |
          echo "$DOCKER_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_REPOSITORY_OWNER" --password-stdin

      - name: Build server image
        run: |
          docker build \
            --target server \
            -t "$REGISTRY/$OWNER/nex-server:${{ steps.meta.outputs.version }}" \
            -t "$REGISTRY/$OWNER/nex-server:latest" \
            .

      - name: Build web image
        run: |
          docker build \
            --target web \
            -t "$REGISTRY/$OWNER/nex-web:${{ steps.meta.outputs.version }}" \
            -t "$REGISTRY/$OWNER/nex-web:latest" \
            .

      - name: Push images
        run: |
          docker push "$REGISTRY/$OWNER/nex-server:${{ steps.meta.outputs.version }}"
          docker push "$REGISTRY/$OWNER/nex-server:latest"
          docker push "$REGISTRY/$OWNER/nex-web:${{ steps.meta.outputs.version }}"
          docker push "$REGISTRY/$OWNER/nex-web:latest"

      - name: Print image digests
        run: |
          docker images --digests "$REGISTRY/$OWNER" --format "table {{.Repository}}:{{.Tag}}\t{{.Digest}}"
