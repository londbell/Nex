# macOS 桌面包发布流水线：打 tag（如 v1.0.0）或手动触发，产出未签名 DMG/ZIP。
#
# 运行器要求：macos-arm64（host 模式 act_runner，Apple Silicon）。
# 需要签名时在 runner/host 上配置密钥链，并设置 secret：
#   NEX_ENABLE_MAC_SIGN=1 + APPLE_SIGNING_IDENTITY（Developer ID Application 全称）
# 不配置则产出未签名包（electron-builder identity=null，见 electron-builder.config.js）。
name: Release macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NEX_ENV: production
  # 不要让 electron-builder 从本机钥匙串自动捡签名身份；签名与否由 NEX_ENABLE_MAC_SIGN 决定。
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # Electron 下载走国内镜像。
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

jobs:
  build-dmg:
    runs-on: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm (pinned)
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap
        run: pnpm bootstrap

      # packages/desktop build = runtime 资产准备 + tsup/vite 产物；
      # bundle:desktop 才跑 electron-builder 产出 dist/*.dmg（本地已端到端验证，含 Developer ID 签名）。
      - name: Build desktop bundles
        run: pnpm --filter @nex/desktop build

      - name: Package DMG (electron-builder)
        run: pnpm bundle:desktop
        env:
          # publish 配置已指向 GitHub Releases（客户端自动更新用）；Gitea 流水线不发 GitHub，
          # 显式关 publish（electron-builder 否则强制要 GH_TOKEN），发布由下面的 API 步骤完成。
          NEX_ELECTRON_BUILDER_ARGS: "--publish never"
          NEX_ENABLE_MAC_SIGN: ${{ vars.NEX_ENABLE_MAC_SIGN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      # 两段式：electron-builder 只签名不公证（配置里 notarize: false），这里单独公证并 stapler。
      - name: Notarize and staple
        if: vars.NEX_ENABLE_MAC_SIGN == '1'
        working-directory: packages/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for artifact in dist/*.dmg dist/*.zip; do
            echo "[notarize] submit $artifact"
            xcrun notarytool submit "$artifact" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          done
          # staple 只支持 dmg/pkg/app；zip 由 Gatekeeper 在线校验公证记录。
          for dmg in dist/*.dmg; do
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          spctl -a -vv -t exec dist/mac-arm64/*.app

      - name: Smoke check artifacts
        run: ls -lh packages/desktop/dist/*.dmg packages/desktop/dist/*.zip

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nex-macos-${{ github.ref_name }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

      # Gitea 不会因为推 tag 自动建 Release；走 API 创建并挂上安装包。
      - name: Create Gitea release with assets
        working-directory: packages/desktop
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release=$(curl -sf -X POST -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" "$API/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Nex $TAG\",\"draft\":false,\"prerelease\":false}" \
            || curl -sf -H "Authorization: token $GITEA_TOKEN" "$API/repos/$REPO/releases/tags/$TAG")
          release_id=$(node -pe "JSON.parse(process.argv[1]).id" "$release")
          echo "[release] id=$release_id tag=$TAG"
          for f in dist/*.dmg dist/*.zip dist/latest-mac.yml; do
            echo "[release] upload $f"
            curl -sf -X POST -H "Authorization: token $GITEA_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$API/repos/$REPO/releases/$release_id/assets?name=$(basename "$f")" > /dev/null
          done
